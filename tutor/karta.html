<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>239+ — карты учеников</title>
<!-- Мини-приложение Telegram: открывается из бота @plus239_bot кнопкой «📒 Ученики».
     Карты репетитора приходят от бота в ?s=, сохранение одного ученика — Telegram.WebApp.sendData → бот хранит у себя (state.json).
     Умения — skills.js; уровни 0–3 и правила — методическая система «239+». -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="skills.js?v=1"></script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--surface:#fff;--surface2:#efece4;--ink:#16171d;--muted:#5d606b;--line:#dedad0;--accent:#ff6a3d;--ok:#1f9d55;--ok-soft:#e1f5e8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1116;--surface:#171a21;--surface2:#1e222b;--ink:#f1efe9;--muted:#a3a7b3;--line:#2a2f3a;--accent:#ff7a4f;--ok:#4cc77a;--ok-soft:#16301f}}
:root[data-theme="dark"]{--bg:#0f1116;--surface:#171a21;--surface2:#1e222b;--ink:#f1efe9;--muted:#a3a7b3;--line:#2a2f3a;--accent:#ff7a4f;--ok:#4cc77a;--ok-soft:#16301f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 Manrope,system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1{font:700 21px/1.15 Unbounded,sans-serif;margin:2px 0 4px;letter-spacing:-.02em}
h2{font:800 13px Manrope;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.muted{color:var(--muted);font-size:13.5px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;color:var(--ink);font:inherit;cursor:pointer}
.card b{font:800 16px Manrope}.card .muted{display:block;margin-top:2px}
.bar{height:6px;border-radius:3px;background:var(--surface2);margin-top:8px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.btn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px;font:700 14px Manrope;cursor:pointer}
.btn.a{background:var(--accent);border-color:var(--accent);color:#fff}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
input,select,textarea{width:100%;font:600 15px Manrope;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:4px 0 10px}
label{font-weight:700;font-size:13.5px;color:var(--muted)}
.sk{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.sk p{margin:0 0 8px;font-weight:700;line-height:1.3}
.sk .muted{font-size:12px;font-weight:600}
.lv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.lv button{border:0;border-radius:10px;padding:9px 0;font:800 16px Manrope;background:var(--surface2);color:var(--muted);cursor:pointer}
.lv button[aria-pressed="true"]{background:var(--accent);color:#fff}
.lv button.was{box-shadow:inset 0 0 0 1.5px var(--muted)}
.legend{font-size:13px;color:var(--muted);background:var(--surface);border-radius:12px;padding:8px 12px;margin-top:10px}
.legend b{color:var(--accent)}
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.sum div{background:var(--surface);border-radius:12px;padding:8px 12px}.sum b{display:block;font:800 22px Manrope}
.pr{display:flex;justify-content:space-between;background:var(--surface);border-radius:10px;padding:8px 12px;margin:6px 0;font-weight:700}
.back{background:none;border:0;color:var(--accent);font:700 15px Manrope;padding:0;margin-bottom:8px;cursor:pointer}
pre{white-space:pre-wrap;font:500 14px/1.45 Manrope;background:var(--surface);border-radius:12px;padding:12px;margin:8px 0}
.save{position:fixed;left:16px;right:16px;bottom:16px;max-width:528px;margin:0 auto;border:0;border-radius:14px;padding:15px;font:800 16px Manrope;background:var(--accent);color:#fff;cursor:pointer}
.err{margin-top:30px;text-align:center}
.del{color:#d33a3a}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<button class="save" id="save" hidden>Сохранить</button>
<script>
(function(){
  var tg = window.Telegram && Telegram.WebApp;
  var $ = function(id){ return document.getElementById(id) }, app = $("app");
  if (tg) { tg.ready(); tg.expand(); document.documentElement.setAttribute("data-theme", tg.colorScheme === "dark" ? "dark" : "light") }
  // ?s= от бота: base64url(JSON {n: репетитор, u: [{i, n, g, t, a, c, d0, d, p}]})
  //   a — уровни на входном срезе, c — сейчас: строка по умениям класса ("-" — не проверяли, 0–3), p — пробники [[дата, %]]
  var S;
  try { var raw = (new URLSearchParams(location.search).get("s") || "").replace(/-/g, "+").replace(/_/g, "/"); S = JSON.parse(decodeURIComponent(escape(atob(raw)))) } catch(e) {}
  if (!S || !S.n) { app.innerHTML = "<p class='err muted'>Откройте эту страницу из бота @plus239_bot: /ucheniki → «📒 Ученики».</p>"; return }
  var U = S.u || [], cur = null, dirty = false;
  var LV = ["не знает метода", "с подсказкой или по образцу", "сам, типовую задачу", "сам, незнакомую задачу на время"];
  var MON = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
  function today(){ var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0") }
  function fd(s){ var p = (s || "").split("-"); return p.length < 3 ? "—" : +p[2] + " " + MON[+p[1]-1] }
  function el(t, c, x){ var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e }
  function list(g){ var r = []; SKILLS[g].blocks.forEach(function(b){ b[1].forEach(function(s){ r.push({b: b[0], t: s[0], l: s[1]}) }) }); return r }
  function lvl(str, i){ var ch = (str || "")[i]; return ch >= "0" && ch <= "3" ? +ch : -1 }
  function setc(str, i, v, n){ var a = (str || "").padEnd(n, "-").split(""); a[i] = String(v); return a.join("") }
  function stat(u){ var L = list(u.g), s = {n: L.length, a2: 0, c2: 0, chk: 0};
    L.forEach(function(_, i){ var a = lvl(u.a, i), c = lvl(u.c, i); if (c >= 0) s.chk++; if (a >= 2) s.a2++; if (c >= 2) s.c2++ }); return s }
  function alertx(m){ tg && tg.showAlert ? tg.showAlert(m) : alert(m) }
  function changed(){ dirty = true; if (tg) { tg.MainButton.setText("Сохранить: " + cur.n); tg.MainButton.show() } else $("save").hidden = false }

  function home(){
    cur = null; app.innerHTML = "";
    app.appendChild(el("div", "muted", "239+ · поступление в 239"));
    app.appendChild(el("h1", null, "Мои ученики"));
    app.appendChild(el("div", "muted", S.n + ". Карта умений: уровень 0–3 по каждому умению, отчёт родителю — в карточке ученика."));
    if (!U.length) app.appendChild(el("p", "muted", "Пока никого нет. Добавьте ученика и проведите входной срез на первом занятии."));
    U.forEach(function(u){
      var s = stat(u), b = el("button", "card"); b.type = "button";
      b.appendChild(el("b", null, u.n));
      b.appendChild(el("span", "muted", SKILLS[u.g].title + " · сам решает " + s.c2 + " из " + s.n + " (было " + s.a2 + ") · обновлено " + fd(u.d)));
      var bar = el("div", "bar"), w1 = el("i"), w2 = el("i");
      w1.style.width = (100 * Math.min(s.a2, s.c2) / s.n) + "%"; w1.style.background = "var(--muted)";
      w2.style.width = (100 * Math.max(0, s.c2 - s.a2) / s.n) + "%"; w2.style.background = "var(--ok)";
      bar.append(w1, w2); b.appendChild(bar);
      b.onclick = function(){ open(u) }; app.appendChild(b);
    });
    var add = el("button", "btn a", "+ Добавить ученика"); add.onclick = form; var r = el("div", "row"); r.appendChild(add); app.appendChild(r);
    if (tg) tg.MainButton.hide();
  }

  function form(){
    app.innerHTML = "";
    var bk = el("button", "back", "← Ученики"); bk.onclick = home; app.appendChild(bk);
    app.appendChild(el("h1", null, "Новый ученик"));
    app.appendChild(el("label", null, "Имя (лучше имя и первая буква фамилии)"));
    var n = el("input"); n.maxLength = 40; app.appendChild(n);
    app.appendChild(el("label", null, "Поступает в класс"));
    var g = el("select"); Object.keys(SKILLS).forEach(function(k){ var o = el("option", null, SKILLS[k].title); o.value = k; g.appendChild(o) }); app.appendChild(g);
    app.appendChild(el("label", null, "Цель и срок"));
    var t = el("textarea"); t.rows = 2; t.maxLength = 160; t.value = SKILLS[g.value].goal; app.appendChild(t);
    g.onchange = function(){ t.value = SKILLS[g.value].goal };
    var ok = el("button", "btn a", "Создать карту"); var r = el("div", "row"); r.appendChild(ok); app.appendChild(r);
    ok.onclick = function(){
      if (!n.value.trim()) return alertx("Напишите имя ученика.");
      var u = {i: Date.now().toString(36), n: n.value.trim(), g: g.value, t: t.value.trim(), a: "", c: "", d0: today(), d: today(), p: []};
      U.push(u); open(u); changed();
    };
  }

  function open(u){
    cur = u; app.innerHTML = ""; scrollTo(0, 0);
    var bk = el("button", "back", "← Ученики");
    bk.onclick = function(){
      if (!dirty) return home();
      var go = function(ok){ if (ok) { dirty = false; location.reload() } };
      tg && tg.showConfirm ? tg.showConfirm("Изменения не сохранены. Выйти без сохранения?", go) : go(confirm("Изменения не сохранены. Выйти без сохранения?"));
    };
    app.appendChild(bk);
    app.appendChild(el("div", "muted", SKILLS[u.g].title + " · карта с " + fd(u.d0)));
    app.appendChild(el("h1", null, u.n));
    app.appendChild(el("label", null, "Цель и срок"));
    var t = el("textarea"); t.rows = 2; t.maxLength = 160; t.value = u.t || ""; t.oninput = function(){ u.t = t.value; changed() }; app.appendChild(t);
    var sum = el("div", "sum"); app.appendChild(sum);
    function drawSum(){ var s = stat(u); sum.innerHTML = "";
      [["Пришёл: сам решает", s.a2 + " из " + s.n], ["Сейчас: сам решает", s.c2 + " из " + s.n]].forEach(function(x){
        var d = el("div"); d.appendChild(el("span", "muted", x[0])); d.appendChild(el("b", null, x[1])); sum.appendChild(d) }) }
    drawSum();
    var lg = el("div", "legend"); lg.innerHTML = "<b>0</b> не знает метода · <b>1</b> с подсказкой · <b>2</b> сам, типовую · <b>3</b> сам, незнакомую на время. Первая отметка — входной срез («было»), уровень повышаем только по задаче на проверке.";
    app.appendChild(lg);
    var L = list(u.g), lastB = null;
    L.forEach(function(s, i){
      if (s.b !== lastB) { app.appendChild(el("h2", null, s.b)); lastB = s.b }
      var box = el("div", "sk"); box.appendChild(el("p", null, s.t));
      var a = lvl(u.a, i), c = lvl(u.c, i);
      var info = el("div", "muted", "Занятия программы: " + s.l.join(", ") + (a >= 0 ? " · было " + a : " · не проверяли"));
      var seg = el("div", "lv");
      [0, 1, 2, 3].forEach(function(v){
        var b = el("button", v === a && a !== c ? "was" : "", String(v)); b.type = "button"; b.title = LV[v];
        b.setAttribute("aria-pressed", v === c);
        b.onclick = function(){
          if (lvl(u.a, i) < 0) u.a = setc(u.a, i, v, L.length);  // первая отметка = входной срез
          u.c = setc(u.c, i, v, L.length); u.d = today();
          var na = lvl(u.a, i);
          seg.querySelectorAll("button").forEach(function(x, k){ x.setAttribute("aria-pressed", k === v); x.className = k === na && na !== v ? "was" : "" });
          info.textContent = "Занятия программы: " + s.l.join(", ") + " · было " + na;
          drawSum(); changed(); if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        };
        seg.appendChild(b);
      });
      box.appendChild(seg); box.appendChild(info); app.appendChild(box);
    });

    app.appendChild(el("h2", null, "Пробники"));
    var pl = el("div"); app.appendChild(pl);
    function drawP(){ pl.innerHTML = ""; if (!u.p.length) pl.appendChild(el("p", "muted", "Пока не было. Пробник по программе — после каждых 2–3 блоков."));
      u.p.forEach(function(x){ var r = el("div", "pr"); r.appendChild(el("span", null, fd(x[0]))); r.appendChild(el("span", null, x[1] + "%")); pl.appendChild(r) }) }
    drawP();
    var pr = el("div", "row"), pin = el("input"); pin.type = "number"; pin.min = 0; pin.max = 100; pin.placeholder = "Результат, %"; pin.style.flex = "1"; pin.style.margin = "0";
    var padd = el("button", "btn", "Добавить"); padd.onclick = function(){ var v = Math.round(+pin.value);
      if (pin.value === "" || v < 0 || v > 100) return alertx("Введите процент от 0 до 100.");
      u.p.push([today(), v]); pin.value = ""; drawP(); changed() };
    pr.append(pin, padd); app.appendChild(pr);

    app.appendChild(el("h2", null, "Родителю"));
    var rep = el("button", "btn a", "Отчёт за блок"), out = el("div");
    rep.onclick = function(){ out.innerHTML = ""; var txt = report(u), p = el("pre", null, txt), cp = el("button", "btn", "Скопировать");
      cp.onclick = function(){ copy(txt) }; out.append(p, cp) };
    var del = el("button", "btn del", "Удалить ученика");
    del.onclick = function(){ var go = function(ok){ if (!ok) return;
        if (tg && tg.sendData) tg.sendData(JSON.stringify({k: "card", del: u.i})); else alertx("Удаление работает только внутри Telegram.") };
      tg && tg.showConfirm ? tg.showConfirm("Удалить карту «" + u.n + "»?", go) : go(confirm("Удалить карту?")) };
    var r = el("div", "row"); r.append(rep, del); app.appendChild(r); app.appendChild(out);
  }

  function report(u){
    var L = list(u.g), up = [], now = [], no = [], a0 = [];
    L.forEach(function(s, i){ var a = lvl(u.a, i), c = lvl(u.c, i); if (c < 0) return;
      var t = s.t.charAt(0).toLowerCase() + s.t.slice(1);
      if (a >= 0) a0.push(t + " — " + a);
      if (c >= 2 && c > a) up.push(t + " (было " + a + " → стало " + c + ")");
      else if (c >= 2) now.push(t);
      if (c <= 1) no.push(t + " (уровень " + c + ")") });
    var st = stat(u), P = u.p.map(function(x){ return fd(x[0]) + " — " + x[1] + "%" }).join(", ");
    var x = "Отчёт: " + u.n + ", поступление в 239, " + SKILLS[u.g].title + "\n\n";
    x += "Цель: " + (u.t || "—") + "\n\n";
    x += "Пришли (срез " + fd(u.d0) + "): сам решал " + st.a2 + " из " + st.n + " типов задач программы.\n\n";
    x += "Сейчас может сам: " + (up.length ? up.join("; ") : "новых умений пока нет") + ".\n";
    if (now.length) x += "Уже умел и держит: " + now.join("; ") + ".\n";
    x += "\nПока не получается без подсказки: " + (no.length ? no.join("; ") : "среди проверенных тем — нет") + ".\n";
    if (P) x += "\nПробники: " + P + ".\n";
    x += "\nСледующий блок: [2–3 умения из «ещё не получается»].\nОт вас: [что нужно от родителя].\n\nУровни: 0 — не знает метода, 1 — решает с подсказкой, 2 — сам решает типовую задачу, 3 — сам решает незнакомую на время.";
    return x;
  }
  function copy(t){
    var done = function(){ alertx("Скопировано — вставьте в чат с родителем и допишите следующий блок.") };
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, fb); else fb();
    function fb(){ var ta = el("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); done() }
  }
  function save(){
    if (!cur) return;
    var u = cur, out = {k: "card", s: {i: u.i, n: u.n, g: u.g, t: u.t, a: u.a, c: u.c, d0: u.d0, d: u.d, p: u.p}};
    if (tg && tg.sendData) tg.sendData(JSON.stringify(out));  // закрывает мини-приложение, бот присылает подтверждение
    else alertx("Сохранение работает только внутри Telegram.");
  }
  if (tg) tg.MainButton.onClick(save); $("save").onclick = save;
  home();
})();
</script>
</body>
</html>
