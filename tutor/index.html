<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>239+ — моё расписание</title>
<!-- Мини-приложение Telegram: открывается из бота @plus239_bot кнопкой «📅 Моё расписание».
     Текущее расписание приходит в #хэше от бота, сохранение — Telegram.WebApp.sendData → бот проверяет, кто это, и коммитит schedule.js. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--surface:#fff;--surface2:#efece4;--ink:#16171d;--muted:#5d606b;--line:#dedad0;--accent:#ff6a3d;--ok:#1f9d55;--ok-soft:#e1f5e8;--busy:#d33a3a;--busy-soft:#fbe4e4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1116;--surface:#171a21;--surface2:#1e222b;--ink:#f1efe9;--muted:#a3a7b3;--line:#2a2f3a;--accent:#ff7a4f;--ok:#4cc77a;--ok-soft:#16301f;--busy:#ff6b6b;--busy-soft:#3a1c1c}}
:root[data-theme="dark"]{--bg:#0f1116;--surface:#171a21;--surface2:#1e222b;--ink:#f1efe9;--muted:#a3a7b3;--line:#2a2f3a;--accent:#ff7a4f;--ok:#4cc77a;--ok-soft:#16301f;--busy:#ff6b6b;--busy-soft:#3a1c1c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 Manrope,system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1{font:700 21px/1.15 Unbounded,sans-serif;margin:2px 0 4px;letter-spacing:-.02em}
.muted{color:var(--muted);font-size:13.5px}
.days{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;width:64px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:8px 0 7px;text-align:center;cursor:pointer;font:inherit}
.day small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.day b{display:block;font:800 19px/1.2 Manrope}
.day .dots{display:flex;justify-content:center;gap:3px;height:7px;margin-top:3px}
.day .dots i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.day .dots i.r{background:var(--busy)}
.day[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.day.we small{color:var(--accent)}
.hours{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}
.h{border:0;border-radius:12px;padding:13px 0;font:800 16px Manrope;font-variant-numeric:tabular-nums;background:var(--surface2);color:var(--muted);cursor:pointer}
.h small{display:block;font:700 11px Manrope;margin-top:1px;opacity:.85}
.h.f{background:var(--ok-soft);color:var(--ok);box-shadow:inset 0 0 0 1.5px var(--ok)}
.h.b{background:var(--busy-soft);color:var(--busy);box-shadow:inset 0 0 0 1.5px var(--busy)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0 4px;font-size:13px;color:var(--muted);font-weight:700}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--surface2)}
.legend .lf::before{background:var(--ok)}.legend .lb::before{background:var(--busy)}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px;font:700 14px Manrope;cursor:pointer}
.save{position:fixed;left:16px;right:16px;bottom:16px;max-width:528px;margin:0 auto;border:0;border-radius:14px;padding:15px;font:800 16px Manrope;background:var(--accent);color:#fff;cursor:pointer}
.err{margin-top:30px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="muted">239+ · расписание</div>
  <h1 id="who">Моё расписание</h1>
  <div class="muted">Время начала занятия (60 мин), МСК. Нажатие: пусто → свободно → занято.</div>
  <div class="legend"><span class="lf">свободно — видно ученикам</span><span class="lb">занято</span><span>закрыто</span></div>
  <div class="days" id="days"></div>
  <div class="hours" id="hours"></div>
  <div class="row">
    <button class="btn" id="copyNext">Повторить этот день через неделю</button>
    <button class="btn" id="clear">Очистить день</button>
  </div>
</div>
<button class="save" id="save" hidden>Сохранить</button>
<script>
(function(){
  var tg = window.Telegram && Telegram.WebApp, WD = ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"], MON = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
  var HOURS = []; for (var h = 9; h <= 21; h++) HOURS.push(h);
  var $ = function(id){ return document.getElementById(id) };
  if (tg) { tg.ready(); tg.expand(); document.documentElement.setAttribute("data-theme", tg.colorScheme === "dark" ? "dark" : "light") }
  // #хэш от бота: base64url(JSON {n: имя, f: {"ГГГГ-ММ-ДД": [17, 18]}, b: {...}})
  var S;
  try { var raw = location.hash.slice(1).replace(/-/g, "+").replace(/_/g, "/"); S = JSON.parse(decodeURIComponent(escape(atob(raw)))) } catch(e) {}
  if (!S || !S.n) { document.querySelector(".wrap").innerHTML = "<p class='err muted'>Откройте эту страницу из бота @plus239_bot: /raspisanie → «📅 Моё расписание».</p>"; return }
  $("who").textContent = S.n;
  // состояние: 0 закрыто, 1 свободно, 2 занято
  var st = {}, dirty = false;
  function iso(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0") }
  var dates = [], now = new Date(); for (var i = 0; i < 14; i++) dates.push(new Date(now.getFullYear(), now.getMonth(), now.getDate() + i));
  dates.forEach(function(d){ var k = iso(d); st[k] = {};
    (S.f[k] || []).forEach(function(h){ st[k][h] = 1 }); (S.b[k] || []).forEach(function(h){ st[k][h] = 2 }) });
  var cur = iso(dates[0]);
  function el(t, c, x){ var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e }
  function renderDays(){
    var box = $("days"); box.innerHTML = "";
    dates.forEach(function(d){
      var k = iso(d), b = el("button", "day" + (d.getDay() % 6 === 0 ? " we" : "")); b.type = "button";
      b.appendChild(el("small", null, k === iso(dates[0]) ? "сегодня" : WD[d.getDay()]));
      b.appendChild(el("b", null, d.getDate())); b.appendChild(el("small", null, MON[d.getMonth()]));
      var dots = el("div", "dots"), v = st[k];
      Object.keys(v).sort(function(a,b){ return a - b }).forEach(function(h){ if (v[h]) dots.appendChild(el("i", v[h] === 2 ? "r" : "")) });
      b.appendChild(dots);
      b.setAttribute("aria-pressed", k === cur); b.onclick = function(){ cur = k; render() };
      box.appendChild(b);
    });
  }
  function renderHours(){
    var box = $("hours"); box.innerHTML = "";
    var nowH = new Date().getHours();
    HOURS.forEach(function(h){
      var v = st[cur][h] || 0, b = el("button", "h" + (v === 1 ? " f" : v === 2 ? " b" : ""), String(h).padStart(2,"0") + ":00"); b.type = "button";
      b.appendChild(el("small", null, v === 1 ? "свободно" : v === 2 ? "занято" : "—"));
      if (cur === iso(dates[0]) && h <= nowH) { b.disabled = true; b.style.opacity = ".4" }
      b.onclick = function(){ st[cur][h] = ((st[cur][h] || 0) + 1) % 3; if (!st[cur][h]) delete st[cur][h]; changed() };
      box.appendChild(b);
    });
  }
  function render(){ renderDays(); renderHours();
    var c = $("days").querySelector('[aria-pressed="true"]'); if (c) c.scrollIntoView({inline: "center", block: "nearest"}) }
  function changed(){ dirty = true; render(); if (tg) { tg.MainButton.setText("Сохранить"); tg.MainButton.show() } else $("save").hidden = false; if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged() }
  $("copyNext").onclick = function(){
    var d = new Date(cur + "T12:00"); d.setDate(d.getDate() + 7); var k = iso(d);
    if (!st[k]) { (tg ? tg.showAlert.bind(tg) : alert)("Через неделю — уже за пределами двух недель."); return }
    st[k] = {}; Object.keys(st[cur]).forEach(function(h){ if (st[cur][h]) st[k][h] = 1 }); changed();
  };
  $("clear").onclick = function(){ st[cur] = {}; changed() };
  function save(){
    var out = {f: {}, b: {}};
    Object.keys(st).forEach(function(k){ Object.keys(st[k]).forEach(function(h){ var t = st[k][h] === 1 ? "f" : "b"; (out[t][k] = out[t][k] || []).push(+h) }) });
    if (tg && tg.sendData) tg.sendData(JSON.stringify(out));  // закрывает мини-приложение, бот присылает результат
    else alert("Сохранение работает только внутри Telegram.");
  }
  if (tg) tg.MainButton.onClick(save); $("save").onclick = save;
  render();
})();
</script>
</body>
</html>
